onboarding = false

[theme]
name = "catppuccin"

[terminal]
default_shell = ""
new_cwd = "follow"

[keys]
# Prefix key for Herdr commands (Ctrl+b)
prefix = "ctrl+b"

# Direct Prefix-Free Pane Navigation (Vim Ctrl+h/j/k/l - no prefix needed!)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# Workspace & Tab Management
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
close_tab = "prefix+shift+x"

# Vim Pane Splitting (v = vertical, s = horizontal)
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Navigate-mode directional movement (Vim keys)
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[ui]
sidebar_width = 26
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = true
tab_bar_position = "top"

[session]
# Auto-resume agent panes after server restarts
resume_agents_on_restore = true

[remote]
# Automatically manage SSH keepalives and connection multiplexing for herdr --remote
manage_ssh_config = true

[experimental]
pane_history = true

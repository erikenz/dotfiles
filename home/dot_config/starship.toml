[custom.git_worktree]
description = "Shows the active Git worktree name (or Delta thread title) when inside a worktree"
command = '''
IFS="
"
set -f
set -- $(git rev-parse --path-format=absolute --git-dir --git-common-dir --show-toplevel 2>/dev/null)
set +f
if [ $# -ge 3 ]; then
    if [ "$1" != "$2" ]; then
        echo "🌲 $(basename "$3")"
    elif case "$3" in */.delta/worktrees/*) true;; *) false;; esac; then
        session=$(basename "$(dirname "$3")")
        for f in "$HOME"/.local/share/delta/user_*/data.sqlite; do
            if [ -f "$f" ]; then
                tname=$(sqlite3 -batch -noheader "$f" "SELECT t.name FROM app_worktree_mounts m JOIN history_timelines wt ON printf('%08X', wt.timeline_timestamp + 2) = substr(hex(m.worktree_id), 5, 8) JOIN histories ht ON wt.history_key = ht.history_key + 1 JOIN app_threads t ON t.history_id = ht.history_uuid WHERE m.namespace = '$session' LIMIT 1;" 2>/dev/null)
                break
            fi
        done
        echo " ${tname:-$session}"
    fi
fi
'''
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
shell = "sh"
style = "bold peach"
format = "([at $output]($style) )"



# ==============================================================================
#  TMUX CONFIGURATION - RICED WITH NOCTALIA & VIM WORKFLOW
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS & TRUECOLOR
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",*:RGB"

# Enable undercurls and undercurl colors
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{1}%d::%p1%{2}%d::%p1%{3}%dm'

# Remove delay on ESC (essential for Vim / Neovim)
set -s escape-time 0

# Generous history limit (crucial for long AI agent outputs and build logs)
set -g history-limit 50000

# 1-based indexing for windows and panes (matches keyboard number row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support enabled (click to focus, resize, scroll)
set -g mouse on

# Focus events enabled (notifies Neovim when pane focus changes)
set -g focus-events on

# Allow terminal passthrough (OSC 52, image preview protocols, etc.)
set -g allow-passthrough on

# Fast status update
set -g status-interval 1

# ------------------------------------------------------------------------------
# 2. ERGONOMIC PREFIX KEY (Ctrl-Space with Neovim-Style Auto Which-Key Delay)
# ------------------------------------------------------------------------------
unbind C-b
unbind C-a

# Unset built-in prefix so root binding can intercept and trigger the delay timer
set -g prefix None

# Intercept Ctrl-Space: launch timer in background & switch to prefix key table
bind-key -n C-Space run-shell -b "bash ~/.config/tmux/scripts/delayed-which-key.sh '#{client_name}'" \; switch-client -T prefix

# Double-tap Ctrl-Space to send literal Ctrl-Space to underlying app
bind-key -T prefix C-Space send-keys C-Space

# Reload config shortcut
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message " tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# 3. VIM-LIKE KEYBINDS FOR PANES & WINDOWS
# ------------------------------------------------------------------------------
# Intuitive splits in current directory
unbind '"'
unbind %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"

# New window in current directory
bind-key c new-window -c "#{pane_current_path}"

# Seamless Vim / Neovim / tmux pane navigation (Ctrl + h/j/k/l)
# Integrates with vim-tmux-navigator and smart-splits.nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Prefix + h/j/k/l for explicit pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Repeatable pane resizing with H, J, K, L
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Swap panes
bind-key -r > swap-pane -D
bind-key -r < swap-pane -U

# Maximize / Zoom toggle (Prefix + z or Prefix + m)
bind-key m resize-pane -Z

# Close pane / window without prompt
bind-key x kill-pane
bind-key X kill-window

# Pane numbers display time (3 seconds to pick)
set -g display-panes-time 3000

# ------------------------------------------------------------------------------
# 4. VI COPY MODE & WAYLAND CLIPBOARD (wl-copy)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ------------------------------------------------------------------------------
# 5. WORKSPACE & AGENT SESSION DASHBOARD
# ------------------------------------------------------------------------------
# Interactive Session Switcher Popup with LIVE LOG PREVIEWS & PROCESS CONTROL
# Open with:
#   - Prefix + s (standard)
#   - Alt + s    (prefixless 1-touch from anywhere inside tmux!)
bind-key s display-popup -E -w 85% -h 75% "bash ~/.config/tmux/scripts/session-switcher.sh"
bind-key -n M-s display-popup -E -w 85% -h 75% "bash ~/.config/tmux/scripts/session-switcher.sh"

# Fast bounce between last two active sessions (like Alt-Tab for sessions!)
bind-key Tab switch-client -l
bind-key -n M-Tab switch-client -l

# Fast cycle sessions (Alt + n / Alt + p)
bind-key -n M-n switch-client -n
bind-key -n M-p switch-client -p
bind-key ( switch-client -p
bind-key ) switch-client -n

# Built-in session tree fallback (Prefix + S)
bind-key S choose-tree -Zs

# ------------------------------------------------------------------------------
# 6. POPULAR RICE FEATURES (FLOATING POPUPS)
# ------------------------------------------------------------------------------
# Floating Lazygit in current directory (Prefix + g)
bind-key g display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E "lazygit"

# Floating Scratchpad Terminal (Prefix + t)
bind-key t display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 80% -E "$SHELL"

# ------------------------------------------------------------------------------
# 7. NOCTALIA DYNAMIC THEMING & STATUS BAR RICING
# ------------------------------------------------------------------------------
# Load theme rendered by Noctalia
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"

# Status bar layout
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Status Left: Pill badge for active session
set -g status-left "#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold]  #S #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold] "

# Status Right: Zoom badge, Current Directory, Clock
set -g status-right "#{?window_zoomed_flag,#[fg=#{@noctalia_error_container},bg=#{@noctalia_surface_container_low}] 󰊓 ZOOMED #[fg=#{@noctalia_outline_variant}]│,}#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}]  #{b:pane_current_path} #[fg=#{@noctalia_outline_variant}]│#[fg=#{@noctalia_on_surface}]  %H:%M #[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_high}] #h "

# Window tabs formatting
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container}] #I #[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}] #W "
set -g window-status-current-format "#[fg=#{@noctalia_on_primary_container},bg=#{@noctalia_primary_container},bold] #I #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest},bold] #W#{?window_zoomed_flag, 󰊓,} "

# ------------------------------------------------------------------------------
# 8. WHICH-KEY MODAL MENU (Inspired by which-key.nvim)
# ------------------------------------------------------------------------------
# Press Prefix + Space, Prefix + ?, or Alt + Space to open Which-Key
bind-key Space run-shell "bash ~/.config/tmux/scripts/which-key.sh"
bind-key ? run-shell "bash ~/.config/tmux/scripts/which-key.sh"
bind-key -n M-Space run-shell "bash ~/.config/tmux/scripts/which-key.sh"
